services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-tp4
    restart: unless-stopped
    ports:
      - "6379:6379"     # servidor Redis (redis-cli, clientes)
      - "8001:8001"     # RedisInsight (interfaz web)
    volumes:
      - redis-tp4-data:/data    # persistencia (RDB/AOF)
    environment:
      # Habilita AOF para que los datos sobrevivan reinicios del contenedor
      REDIS_ARGS: "--appendonly yes"

volumes:
  redis-tp4-data:
